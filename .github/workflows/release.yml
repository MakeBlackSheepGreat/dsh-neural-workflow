name: release

# 只由版本 tag 触发。tag 是发布的唯一入口：分支 push 只跑 ci.yml。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release 需要写 Release

jobs:
  release:
    name: verify + pack + release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要 tag 对象本身

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      # tag 与 package.json 版本不一致是最常见的发版事故：tag 打了 v0.6.0，
      # 包里还是 0.5.0，装上去按版本号判断"没变"于是不重装。
      - name: verify tag matches package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./dsh-plugin.json').version")
          EXPECTED="v${PKG_VERSION}"
          echo "tag=$TAG package.json=$PKG_VERSION dsh-plugin.json=$MANIFEST_VERSION"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::tag '$TAG' 与 package.json version '$PKG_VERSION' 不一致（应为 '$EXPECTED'）"
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::dsh-plugin.json version '$MANIFEST_VERSION' 与 package.json '$PKG_VERSION' 不一致"
            exit 1
          fi

      - name: install dependencies
        run: npm install --no-audit --no-fund

      - name: install chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: expose chrome to visual-check
        run: |
          set -euo pipefail
          CHROME="${{ steps.chrome.outputs.chrome-path }}"
          if [ -z "$CHROME" ] || [ ! -x "$CHROME" ]; then
            echo "::error::setup-chrome 没有给出可执行的 chrome-path（得到 '$CHROME'）"
            exit 1
          fi
          echo "DSH_CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      # 知识库的源在**另一个私有仓库**里，干净 runner 上没有、匿名也 clone 不到
      # （实测 `could not read Username for 'https://github.com'`）。
      # 所以这里不拉源：`node scripts/build-kb.mjs --check` 会在源缺席时
      # 明确降级为"产物自洽校验"，并把降级本身打印到日志里——不硬失败、也不假绿。
      # 想在 CI 里做与源的逐字比对，就得给这个仓配 deploy key 并设 NEURAL_PAPER_SKILL。
      - name: note knowledge base source
        run: |
          echo "::notice::知识库源在私有仓，CI 只做产物自洽校验；与源逐字比对需 deploy key + NEURAL_PAPER_SKILL"

      - name: build native middleware
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: stage native binary
        run: node scripts/build.mjs

      - name: check
        run: npm run check

      - name: test
        run: npm test

      # 发版物必须带 Linux 二进制，否则装到 Linux 上的 profile 会退化成只读。
      - name: pack
        run: |
          set -euo pipefail
          npm pack
          ls -l ./*.tgz
          TGZ=$(ls ./*.tgz | head -1)
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"
          echo "tarball: $TGZ"

      # 注意不能用 `tar -tzf | grep -q`：grep -q 一匹配就关管道，
      # tar 收到 SIGPIPE 打 `tar: stdout: write error`，在 pipefail 下整条管道
      # 被判失败——即使文件明明在包里（实测 24 个文件里就有它）。
      # 先落盘再查，就没有这个竞态。
      - name: verify tarball contains native binary
        run: |
          set -euo pipefail
          tar -tzf "$TGZ" > .tarball-list.txt
          if ! grep -qx 'package/lib/native/nw-constrain' .tarball-list.txt; then
            echo "::error::tarball 里没有 package/lib/native/nw-constrain"
            grep -E 'lib/native' .tarball-list.txt || echo "（包里没有任何 lib/native 条目）"
            exit 1
          fi
          echo "tarball 含 package/lib/native/nw-constrain"


      # 没有 NPM_TOKEN，所以不发布到 npm：只把 tgz 挂到 GitHub Release。
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TGZ }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: upload release logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            .visual
            npm-debug.log
            ./*.tgz
          if-no-files-found: ignore
          retention-days: 7
