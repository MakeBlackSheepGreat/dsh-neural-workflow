[package]
name = "nw-constrain"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Neural-network workflow constraint middleware for the dsh-neural-workflow DSH plugin"

[[bin]]
name = "nw-constrain"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
